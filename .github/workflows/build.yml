name: 构建并发布 APK

on:
  push:
    branches: [main]
    tags: ['v*']
    # 只改文档/测试截图/AI 插画源图的推送不触发构建发布（标签推送不受 paths 过滤影响）
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'test/**/*.png'
      - 'test/human23/**'
      - 'test/human_olaf/**'
      - 'art/gen/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 计算版本号
        id: ver
        run: |
          BASE=$(cat VERSION)
          CODE=$((100 + ${{ github.run_number }}))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; TAG="$GITHUB_REF_NAME"; else NAME="$BASE"; TAG="build-$CODE"; fi
          echo "name=$NAME" >> $GITHUB_OUTPUT; echo "code=$CODE" >> $GITHUB_OUTPUT; echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "versionName=$NAME versionCode=$CODE tag=$TAG"

      - name: 还原签名密钥（与 v1/v2 相同的 keystore）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::缺少 ANDROID_KEYSTORE_B64 secret"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/wbx.keystore"
          echo "WBX_KEYSTORE=$RUNNER_TEMP/wbx.keystore" >> $GITHUB_ENV

      - name: 构建精简版 APK（仓库内 SD 资源，同一签名）→ wobuxian-lite.apk
        env:
          WBX_VERSION_NAME: ${{ steps.ver.outputs.name }}
          WBX_VERSION_CODE: ${{ steps.ver.outputs.code }}
          WBX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WBX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WBX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE: gradle
        run: |
          grep -o '"profile":"[a-z]*"' www/assets/assets.json
          ./build.sh
          mv wobuxian.apk wobuxian-lite.apk

      - name: 下载高清资源包（release assets-hd，按 hd-assets.json 校验后覆盖 www/assets）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f hd-assets.json ]; then
            TAG=$(jq -r .tag hd-assets.json); F=$(jq -r .file hd-assets.json); SHA=$(jq -r .sha256 hd-assets.json)
            gh release download "$TAG" -p "$F" -D "$RUNNER_TEMP" --clobber
            echo "$SHA  $RUNNER_TEMP/$F" | sha256sum -c -
            unzip -q -o "$RUNNER_TEMP/$F" -d www/
            rm -f "$RUNNER_TEMP/$F"; du -sh www/assets; grep -o '"profile":"[a-z]*"' www/assets/assets.json
            if [ -d art/gen/hd ]; then cp art/gen/hd/*.webp www/assets/gen/; if ls art/gen/hd/cg/*.webp >/dev/null 2>&1; then cp art/gen/hd/cg/*.webp www/assets/cg/; fi; echo "AI 插画：已换成 HD 尺寸"; fi
          else
            echo "::warning::没有 hd-assets.json，使用仓库内的轻量资源构建"
          fi

      - name: 构建高清版 APK → wobuxian.apk，并校验两个 APK 的签名
        env:
          WBX_VERSION_NAME: ${{ steps.ver.outputs.name }}
          WBX_VERSION_CODE: ${{ steps.ver.outputs.code }}
          WBX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WBX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WBX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE: gradle
        run: |
          ./build.sh
          for A in wobuxian.apk wobuxian-lite.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$A" | tee certs.txt
            grep -qi "436bf9221c08db212a13a9e8d64459f27cca9777223b7c21480fb33ce7ef29dc" certs.txt || { echo "::error::$A 签名证书与 v1/v2 不一致"; exit 1; }
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$A" | head -1; ls -la "$A"
          done
          rm -f "$WBX_KEYSTORE"

      - uses: actions/upload-artifact@v4
        with:
          name: wobuxian-apk
          path: wobuxian.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wobuxian-lite-apk
          path: wobuxian-lite.apk

      - name: 发布到 GitHub Release（latest）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"; NAME="${{ steps.ver.outputs.name }}"; CODE="${{ steps.ver.outputs.code }}"
          NOTES="我不仙 v$NAME 自动构建（commit ${GITHUB_SHA::7}）
          versionName: $NAME
          versionCode: $CODE

          高清版：https://github.com/${{ github.repository }}/releases/latest/download/wobuxian.apk
          精简版（标清资源，国内下载更快）：https://github.com/${{ github.repository }}/releases/latest/download/wobuxian-lite.apk
          两个版本签名相同，可互相覆盖安装。
          可直接覆盖安装旧版本，存档保留。"
          # 带“-”的标签（如 v2.3.0-beta1）是预发布：不标 latest，游戏内更新检查也会忽略
          if [[ "$TAG" == *-* ]]; then FLAG="--prerelease"; EFLAG="--prerelease"; else FLAG="--latest"; EFLAG="--latest"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" wobuxian.apk wobuxian-lite.apk --clobber
            gh release edit "$TAG" --notes "$NOTES" $EFLAG
          else
            gh release create "$TAG" wobuxian.apk wobuxian-lite.apk --title "我不仙 v$NAME (build $CODE)" --notes "$NOTES" --target "$GITHUB_SHA" $FLAG
          fi
          # 每个发布都必须同时带高清版和精简版，否则 /releases/latest/download/wobuxian-lite.apk 会 404
          A=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for F in wobuxian.apk wobuxian-lite.apk; do echo "$A" | grep -qx "$F" || { echo "::error::Release $TAG 缺少 $F"; exit 1; }; done
          echo "Release $TAG 资产：$(echo $A)"

  # 在 GitHub 托管的 x86_64 模拟器（KVM + swiftshader，无窗口）中安装并启动 APK，检查崩溃与 JS 报错
  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wobuxian-apk
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash .github/emu_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-api${{ matrix.api }}
          path: |
            emu_*.png
            logcat.txt
