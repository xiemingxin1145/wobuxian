<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>方块低模角色 · 预览（开放世界线原型）</title>
  <style>
    body { margin: 0; background: #101b25; color: #f1e1c8; font: 14px sans-serif; }
    header { padding: 10px 14px; }
    canvas { display: block; width: 100%; max-width: 820px; margin: 0 auto; background: #1d2a22; }
    .tip { opacity: .7; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <b>方块低模角色预览</b>（青衫剑修 / 讨债鬼差）· 每行：待机 / 行走 / 挥砍，四个朝向
    <div class="tip">Canvas 现画长方体，零贴图；不接入正式游戏。点画面切换缩放。</div>
    <button id="try" style="margin-top:6px;padding:6px 12px;background:#2a5a3a;color:#b0ffb0;border:1px solid #b0ffb0;border-radius:12px;">用方块角色试打即时战原型</button>
  </header>
  <canvas id="cv" width="820" height="640"></canvas>
  <script src="../../js/lowpoly_box_chars.js"></script>
  <script src="../../js/battle_realtime_prototype.js"></script>
  <script>
    'use strict';
    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    const FACES = [[0, 1, '下'], [1, 0, '右'], [0, -1, '上'], [-1, 0, '左']];
    const ANIMS = ['idle', 'walk', 'attack'];
    let scale = 1.0, t0 = performance.now();
    document.getElementById('try').onclick = () => RealtimeBattle.open([{ name: '讨债鬼差', hp: 80, x: 420, y: 200, speed: 70 }, { name: '讨债鬼差', hp: 80, x: 160, y: 160, speed: 60 }], { force: true, skin: 'box' });
    cv.addEventListener('click', () => { scale = scale > 1 ? 0.8 : 1.3; });
    function frame(now) {
      const t = (now - t0) / 1000;
      ctx.fillStyle = '#1d2a22'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#f1e1c8'; ctx.font = '12px sans-serif';
      LowpolyBox.ids.forEach((id, ci) => {
        ANIMS.forEach((anim, ai) => {
          const row = ci * 3 + ai, y = 100 + row * 92;
          if (ai === 0) ctx.fillText(LowpolyBox.CHARS[id].name, 8, y - 50);
          ctx.fillText(anim, 8, y - 20);
          FACES.forEach(([fx, fy, lb], fi) => {
            const x = 140 + fi * 180;
            if (row === 0) ctx.fillText('面向' + lb, x - 16, 14);
            ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x, y, 20 * scale, 8 * scale, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#f1e1c8';
            LowpolyBox.draw(ctx, id, x, y, { scale: scale * 0.7, angle: LowpolyBox.angleFromFace(fx, fy), anim, t: anim === 'attack' ? (t % 1) : t });
            ctx.fillStyle = '#f1e1c8';
          });
        });
      });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
