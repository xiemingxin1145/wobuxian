<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1430">
<title>我不仙 · 修仙人生模拟器</title>
<style>
:root{--ink:#3a2414;--paper:#fbf3de;--paper2:#efdcb0;--gold:#d9a441;--jade:#2f8a7a;--red:#b8402a;
  --font:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1430;font-family:var(--font);color:var(--ink);touch-action:manipulation}
#cv{position:fixed;inset:0;display:block}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:5}
.screen.on{display:flex}
button{font-family:var(--font)}
/* 按钮：玉质 */
.btn{position:relative;border:2px solid #f3d98a;border-radius:14px;padding:12px 18px;min-width:120px;font-size:18px;font-weight:900;letter-spacing:2px;color:#fffbe8;
  background:linear-gradient(180deg,#6fd6bd 0%,#33a08a 45%,#1f7a68 100%);box-shadow:0 4px 0 #11524a,0 6px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.45);
  text-shadow:0 2px 0 rgba(0,60,50,.6);transition:transform .08s,box-shadow .08s;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #11524a,0 3px 8px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.gold{background:linear-gradient(180deg,#ffe9a0 0%,#f2b844 50%,#c98a1c 100%);color:#5a2a08;text-shadow:0 1px 0 rgba(255,255,255,.6);box-shadow:0 4px 0 #8a5a10,0 6px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.red{background:linear-gradient(180deg,#f08a6a 0%,#c8503a 50%,#93301e 100%);box-shadow:0 4px 0 #5e1a0e,0 6px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.ghost{background:linear-gradient(180deg,#fff8e4,#ecd9a8);color:var(--ink);border-color:#b8862e;text-shadow:none;box-shadow:0 3px 0 #9a6e2a,inset 0 2px 0 #fff}
.btn.sm{font-size:15px;padding:9px 12px;min-width:0}
.btn.xs{font-size:12px;padding:4px 8px;min-width:0;border-radius:10px;letter-spacing:0}
.btn:disabled{filter:grayscale(.9) brightness(.9);opacity:.6}
.btn.glow{animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:0 4px 0 #8a5a10,0 0 6px #ffd75e}to{box-shadow:0 4px 0 #8a5a10,0 0 22px 6px #ffd75e}}
/* 卷轴面板 */
.panel{position:relative;width:min(94vw,460px);background:linear-gradient(180deg,var(--paper) 0%,var(--paper2) 100%);border:2px solid #8a5a2a;border-radius:16px;padding:18px 16px 16px;
  box-shadow:inset 0 0 0 3px #f8e7b8,inset 0 0 0 5px #c99a3e,inset 0 0 30px rgba(160,110,40,.25),0 10px 30px rgba(0,0,0,.45)}
.panel::before,.panel::after{content:"";position:absolute;left:-8px;right:-8px;height:12px;border-radius:6px;background:linear-gradient(180deg,#a0522d,#5e2a12);border:1px solid #f3d98a;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.panel::before{top:-7px}.panel::after{bottom:-7px}
.panel.tall{max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.ptitle{text-align:center;font-size:24px;font-weight:900;color:#7a2a12;letter-spacing:4px;margin:2px 0 6px;text-shadow:0 1px 0 #fff}
.ptitle small{font-size:13px;color:#8a6a4a;letter-spacing:1px;font-weight:400}
.ptitle.s{font-size:18px;margin-top:10px}
.ptitle::after{content:"";display:block;height:2px;margin:6px auto 0;width:60%;background:linear-gradient(90deg,transparent,#c99a3e,transparent)}
.hint{text-align:center;font-size:12px;color:#8a6a4a;margin-bottom:6px}
.row2{display:flex;gap:10px;justify-content:center;margin-top:10px}
.row2 .btn{flex:1}
.bottom{margin-top:12px}
/* 标题 */
#title{justify-content:space-between;padding:8vh 20px 5vh}
.logo-wrap{text-align:center;margin-top:2vh}
.logo{font-size:min(26vw,120px);font-weight:900;line-height:1.05;letter-spacing:6px;background:linear-gradient(180deg,#fff7c8 0%,#ffd75e 40%,#e08a1c 70%,#a8500c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5a1a08) drop-shadow(0 0 10px rgba(255,220,120,.6));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.logo-sub{display:inline-block;color:#fff;font-size:15px;letter-spacing:3px;background:rgba(122,42,18,.75);border:1px solid #f3d98a;padding:4px 14px;border-radius:20px;margin-top:6px}
.logo-sub.top{background:rgba(47,138,122,.8)}
.menu{display:flex;flex-direction:column;gap:12px;width:min(78vw,320px)}
.menu .btn{width:100%}
.meta-line{color:#fff;font-size:12px;text-shadow:0 1px 2px #000;text-align:center;min-height:16px}
/* 天赋卡 */
.cards{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.card{display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 10px;background:linear-gradient(90deg,#fffaf0,#f6e7c4);border:2px solid #d8c08a;transition:transform .1s}
.card .gem{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.3)}
.card .tn{font-weight:900;font-size:16px}
.card .td{font-size:12px;color:#6a4a2a;margin-top:2px}
.card.sel{border-color:#e0a020;background:linear-gradient(90deg,#fff3c0,#ffd97a);transform:scale(1.02);box-shadow:0 0 12px rgba(255,200,60,.8)}
.card.r3{border-color:#ffb020}
/* 属性 */
.namebox,.lingbox{display:flex;align-items:center;gap:10px;margin:4px 0;font-size:16px}
.namebox span,.lingbox span{color:#8a6a4a;width:40px}
.namebox b,.lingbox b{flex:1;font-size:20px;color:#7a2a12}
.lingdesc{font-size:12px;color:#8a6a4a;margin:0 0 4px 50px}
.srow{display:flex;align-items:center;gap:8px;margin:6px 0}
.srow .sn{width:44px;font-weight:900}
.srow .sd{flex:1;font-size:11px;color:#8a6a4a}
.srow .sv{width:28px;text-align:center;font-size:20px;font-weight:900;color:#2f8a7a}
.srow .btn{width:36px;height:36px;padding:0;min-width:0;font-size:20px;border-radius:50%}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:4;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:linear-gradient(180deg,rgba(40,24,12,.88),rgba(40,24,12,.6));border-bottom:2px solid #c99a3e;color:#fff6dc}
.hud-row{display:flex;align-items:center;gap:8px}
.seal{background:linear-gradient(180deg,#d8503a,#9a2a18);color:#fff;font-weight:900;padding:4px 8px;border-radius:6px;border:1px solid #ffd75e;font-size:15px;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.hname{flex:1;display:flex;flex-direction:column;line-height:1.15;min-width:0}
.hname b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hname span{font-size:11px;color:#f3d98a}
.hstone{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:900;color:#ffe08a}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8fff8,#5fd6c0 40%,#1f7a68);box-shadow:0 0 6px #5fd6c0;transform:rotate(45deg);border-radius:3px}
.ib{background:none;border:1px solid #c99a3e;color:#ffe08a;font-size:20px;border-radius:8px;width:36px;height:32px}
.bars{display:flex;gap:10px;margin-top:5px}
.bar{flex:1;display:flex;align-items:center;gap:4px;font-size:11px}
.bar i{font-style:normal;color:#ffd75e;font-weight:900}
.bar em{font-style:normal;min-width:56px;text-align:right;color:#fff}
.track{flex:1;height:9px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;border:1px solid rgba(255,215,94,.4)}
.fill{height:100%;width:0;border-radius:5px;transition:width .5s}
.fill.life{background:linear-gradient(90deg,#ff7a6a,#ffb07a)}
.fill.exp{background:linear-gradient(90deg,#5fd6c0,#9fe8ff)}
.statline{display:flex;justify-content:space-between;font-size:11px;margin-top:4px;color:#f3e2b8}
.statline b{color:#fff;margin-left:2px}
/* 底部 */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(180deg,#fbf3de,#ead6a6);border-top:3px solid #8a5a2a;box-shadow:0 -6px 20px rgba(0,0,0,.35)}
#bottom::before{content:"";position:absolute;left:0;right:0;top:-9px;height:6px;background:linear-gradient(180deg,#a0522d,#5e2a12)}
#log{height:min(24vh,200px);overflow-y:auto;font-size:14px;line-height:1.55;padding:6px 8px;background:rgba(255,255,255,.45);border:1px solid #d8c08a;border-radius:10px;-webkit-overflow-scrolling:touch}
#log p{margin:0 0 6px;animation:fin .4s}
@keyframes fin{from{opacity:0;transform:translateY(6px)}}
#log .age{display:inline-block;background:#b8402a;color:#fff;font-size:11px;padding:0 5px;border-radius:4px;margin-right:5px;font-weight:900;vertical-align:1px}
#log .res{color:#2f8a7a;font-weight:700}
#log .bad{color:#b8402a;font-weight:700}
#log .gold{color:#c07a00;font-weight:900}
#actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#actions .btn{font-size:16px;padding:10px 6px;min-width:0;line-height:1.15}
#actions .btn small{display:block;font-size:10px;font-weight:400;letter-spacing:0;opacity:.85;margin-top:2px}
#actions .btn.wide{grid-column:span 2;font-size:20px;padding:14px}
.subbar{display:flex;gap:8px;margin-top:8px}
.subbar .btn{flex:1}
#battleTag{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(120,20,20,.85);color:#ffe08a;border:1px solid #ffd75e;padding:5px 14px;border-radius:20px;font-weight:900;font-size:14px;animation:float 1s infinite;pointer-events:none}
#banner{position:fixed;left:0;right:0;top:32%;z-index:7;text-align:center;pointer-events:none;font-size:42px;font-weight:900;letter-spacing:6px;color:#fff6c0;
  text-shadow:0 0 10px #ffb020,0 3px 0 #7a2a12,0 0 30px rgba(255,200,60,.8);animation:bann 2s forwards}
#banner small{display:block;font-size:18px;letter-spacing:2px;margin-top:6px}
@keyframes bann{0%{opacity:0;transform:scale(2.2)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
/* 弹窗 */
#modal{position:fixed;inset:0;z-index:10;background:rgba(10,6,20,.55);display:flex;align-items:center;justify-content:center;padding:14px;animation:mfade .2s}
@keyframes mfade{from{opacity:0}}
#mBox{animation:mpop .25s cubic-bezier(.2,1.5,.5,1);max-height:88vh;overflow-y:auto}
@keyframes mpop{from{transform:scale(.8);opacity:0}}
.ev{display:flex;gap:12px;align-items:flex-start}
.ev canvas{flex:none;width:92px;height:104px;border-radius:12px;border:2px solid #c99a3e;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ev .who{font-weight:900;color:#7a2a12;font-size:15px;margin-bottom:4px}
.ev .txt{font-size:15px;line-height:1.6}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.choices .btn{width:100%;font-size:16px}
.result{margin-top:10px;padding:10px;border-radius:10px;background:rgba(47,138,122,.12);border:1px dashed #2f8a7a;font-size:15px;line-height:1.6;color:#1f5a4e}
.list .it{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px dashed #d8c08a}
.list .it .nm{font-weight:900;font-size:16px}
.list .it .ds{font-size:12px;color:#8a6a4a}
.list .it>div{flex:1}
.loc{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;margin:8px 0;background:linear-gradient(90deg,#fffaf0,#f0dcae);border:2px solid #d8c08a}
.loc.cur{border-color:#2f8a7a;box-shadow:0 0 8px rgba(47,138,122,.6)}
.loc.lock{filter:grayscale(1);opacity:.6}
.loc .ln{font-weight:900;font-size:17px}
.loc .ld{font-size:12px;color:#8a6a4a}
.loc>div{flex:1}
.big{font-size:15px;line-height:1.7}
.grade{text-align:center;font-size:56px;font-weight:900;color:#c8301e;margin:4px 0;text-shadow:0 2px 0 #fff,0 0 12px rgba(200,48,30,.4)}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #d8c08a;font-size:14px}
.kv b{color:#7a2a12}
.scroll{overflow-y:auto}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20;transition:opacity .35s}
#fade.on{opacity:1}
.toast{position:fixed;left:50%;bottom:45%;transform:translateX(-50%);background:rgba(40,20,10,.9);color:#ffe08a;padding:8px 16px;border-radius:20px;z-index:30;font-size:14px;border:1px solid #c99a3e;animation:fin .3s}
.tbottom{display:flex;flex-direction:column;align-items:center;gap:10px}

</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- 标题 -->
<div id="title" class="screen">
  <div class="logo-wrap">
    <div class="logo-sub top">修仙人生模拟器</div>
    <div class="logo">我不仙</div>
    <div class="logo-sub">从凡人开始 · 欠天道一个飞升</div>
  </div>
  <div class="tbottom"><div class="menu">
    <button class="btn gold" id="bContinue">继续此生</button>
    <button class="btn" id="bNew">投胎转世</button>
    <div class="row2"><button class="btn red sm" id="bMeta">轮回殿</button><button class="btn red sm" id="bHist">往世录</button></div>
    <div class="row2"><button class="btn ghost sm" id="bMusic">音乐：开</button><button class="btn ghost sm" id="bHelp">玩法</button></div>
  </div>
  <div class="meta-line" id="metaLine"></div></div>
</div>

<!-- 创建角色：天赋 -->
<div id="talentScr" class="screen">
  <div class="panel tall">
    <div class="ptitle">天赋抽签 <small>选择 3 个</small></div>
    <div class="hint">命里有时终须有，命里无时……可以刷新</div>
    <div id="talentList" class="cards"></div>
    <div class="row2 bottom"><button class="btn ghost sm" id="bReroll">刷新(1)</button><button class="btn gold" id="bTalentOk">下一步</button></div>
  </div>
</div>

<!-- 创建角色：属性 -->
<div id="statScr" class="screen">
  <div class="panel tall">
    <div class="ptitle">投胎设定</div>
    <div class="namebox"><span>姓名</span><b id="nameV">李二狗</b><button class="btn ghost xs" id="bName">换一个</button></div>
    <div class="lingbox"><span>灵根</span><b id="lingV">？？？</b><button class="btn ghost xs" id="bLing">摸骨</button></div>
    <div class="lingdesc" id="lingD">出生后才知道</div>
    <div class="ptitle s">先天属性 <small>剩余 <b id="ptsV">0</b> 点</small></div>
    <div id="statList"></div>
    <div class="row2 bottom"><button class="btn ghost sm" id="bRand">随机分配</button><button class="btn gold" id="bBorn">呱呱坠地！</button></div>
  </div>
</div>

<!-- 游戏 -->
<div id="hud" class="hidden">
  <div class="hud-row">
    <div class="seal" id="hRealm">凡人</div>
    <div class="hname"><b id="hName">某某</b><span id="hLoc">桃花村</span></div>
    <div class="hstone"><i class="coin"></i><b id="hStone">0</b></div>
    <button class="ib" id="bMenu">☰</button>
  </div>
  <div class="bars">
    <div class="bar"><i>寿</i><div class="track"><div class="fill life" id="hLifeF"></div></div><em id="hLife">0/70</em></div>
    <div class="bar"><i>修</i><div class="track"><div class="fill exp" id="hExpF"></div></div><em id="hExp">0/20</em></div>
  </div>
  <div class="statline" id="hStats"></div>
</div>
<div id="battleTag" class="hidden">斗法中 · 点击加速</div>
<div id="banner" class="hidden"></div>
<div id="bottom" class="hidden">
  <div id="log"></div>
  <div id="actions"></div>
  <div class="subbar">
    <button class="btn ghost sm" id="bMap">地 图</button>
    <button class="btn ghost sm" id="bBag">行 囊</button>
    <button class="btn gold sm" id="bBreak">突 破</button>
  </div>
</div>

<!-- 结算 -->
<div id="deathScr" class="screen">
  <div class="panel tall scroll">
    <div class="ptitle" id="dTitle">此生已尽</div>
    <div id="dBody"></div>
    <div class="row2 bottom"><button class="btn red sm" id="dMeta">轮回殿</button><button class="btn gold" id="dAgain">再入轮回</button></div>
  </div>
</div>

<!-- 通用弹窗 -->
<div id="modal" class="hidden"><div class="panel" id="mBox"></div></div>
<div id="fade"></div>

<script>
/* 数据：境界、灵根、天赋、事件、物品、轮回殿 */
'use strict';
const REALMS = [
  { n: '凡人', life: 70, need: 20, stages: 1, col: '#9a9a9a', robe: '#8aa0b8', aura: null, rate: 0.95 },
  { n: '练气', life: 120, need: 60, stages: 4, col: '#5fb760', robe: '#6fbf8a', aura: null, rate: 0.75 },
  { n: '筑基', life: 200, need: 180, stages: 4, col: '#3a9ad9', robe: '#5a9ee0', aura: 'rgba(120,200,255,0.6)', rate: 0.6 },
  { n: '金丹', life: 350, need: 520, stages: 4, col: '#e0a020', robe: '#f0c050', aura: 'rgba(255,215,90,0.7)', rate: 0.5, trib: 3 },
  { n: '元婴', life: 600, need: 1500, stages: 4, col: '#d0509a', robe: '#e07ab8', aura: 'rgba(255,140,200,0.7)', rate: 0.42, trib: 5 },
  { n: '化神', life: 1000, need: 4200, stages: 4, col: '#8a5ae0', robe: '#a07af0', aura: 'rgba(190,140,255,0.75)', rate: 0.35, trib: 7 },
  { n: '渡劫', life: 1600, need: 12000, stages: 4, col: '#e04040', robe: '#fff4e0', aura: 'rgba(255,240,200,0.85)', rate: 0.3, trib: 9 },
  { n: '飞升', life: 99999, need: 1, stages: 1, col: '#ffd75e', robe: '#fffaf0', aura: 'rgba(255,255,220,0.95)', rate: 0, trib: 12 }
];
const STAGES = ['初期', '中期', '后期', '圆满'];
const LINGGEN = [
  { n: '天灵根', d: '万中无一，修炼如喝水', mul: 2.2, w: 3, col: '#ffd75e' },
  { n: '异灵根·雷', d: '天劫见了你都得喊声老乡', mul: 1.8, w: 5, col: '#c08aff', trib: 0.15 },
  { n: '双灵根', d: '资质上佳，长老会多看你两眼', mul: 1.4, w: 14, col: '#7fd3ff' },
  { n: '三灵根', d: '普普通通，勤能补拙', mul: 1.0, w: 30, col: '#9be15d' },
  { n: '四灵根', d: '杂了点，但杂粮更健康', mul: 0.75, w: 24, col: '#e9d39c' },
  { n: '伪灵根', d: '测灵石亮了一下，又灭了', mul: 0.5, w: 16, col: '#bbb' },
  { n: '没有灵根', d: '纯种凡人，修仙全靠头铁', mul: 0.28, w: 8, col: '#888' }
];
const STATS = [['con', '体魄', '影响战力与寿元'], ['int', '悟性', '影响修炼与突破'], ['luck', '气运', '影响奇遇与保命'], ['cha', '魅力', '影响人缘与价格'], ['wealth', '家境', '影响初始灵石']];
// 天赋 r: 0灰 1蓝 2紫 3金
const TALENTS = [
  { id: 'jxzs', n: '剑仙转世', r: 3, d: '斗法战力+50%，梦里常有人喊你还剑钱', m: { pow: 0.5 } },
  { id: 'tsdt', n: '天生道体', r: 3, d: '修炼速度+50%', m: { cult: 0.5 } },

'use strict';
const SFX = (() => {
  let ac = null, master = null, musicGain = null, musicOn = true, sfxOn = true, timer = null, step = 0;
  const PENTA = [0, 2, 4, 7, 9]; // 宫商角徵羽

    if (ac) { if (ac.state === 'suspended') ac.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ac = new AC(); master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.gain.value = musicOn ? 0.32 : 0; musicGain.connect(master);
    startMusic(); return true;
  }
  function env(g, t, a, d, peak) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone(freq, dur, type = 'sine', vol = 0.2, when = 0, dest) {
    if (!ac) return; const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); o.connect(g); g.connect(dest || master); env(g, t, 0.005, dur, vol); o.start(t); o.stop(t + dur + 0.05); return o;
  }
  function pluck(freq, vol = 0.18, when = 0, dest) { // 古筝感拨弦
    tone(freq, 1.6, 'triangle', vol, when, dest); tone(freq * 2, 0.6, 'sine', vol * 0.35, when, dest); tone(freq * 3.01, 0.25, 'sine', vol * 0.15, when, dest);
  }
  function noise(dur, vol = 0.3, f = 1200, q = 1, when = 0, type = 'bandpass') {
    if (!ac) return; const t = ac.currentTime + when, n = ac.sampleRate * dur, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    s.connect(fl); fl.connect(g); g.connect(master); env(g, t, 0.005, dur, vol); s.start(t);
  }
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  function startMusic() {
    if (timer) return; const beat = 0.42; let next = ac.currentTime + 0.2;
    const prog = [[50, 57], [48, 55], [45, 52], [47, 54]];
    timer = setInterval(() => {
      if (!ac) return;
      while (next < ac.currentTime + 0.5) {

        if (Math.random() < (pos % 2 ? 0.35 : 0.7)) { const deg = PENTA[(Math.random() * 5) | 0], oct = Math.random() < 0.3 ? 12 : 0; pluck(midi(62 + deg + oct), 0.09, w, musicGain); }

  }

    wood() { if (!sfxOn || !ensure()) return; tone(520, 0.08, 'sine', 0.2); noise(0.04, 0.1, 2500, 3); },
    coin() { if (!sfxOn || !ensure()) return; tone(1568, 0.08, 'square', 0.05); tone(2093, 0.2, 'square', 0.05, 0.07); },

    swish() { if (!sfxOn || !ensure()) return; noise(0.22, 0.18, 3000, 2, 0, 'highpass'); },

    death() { if (!sfxOn || !ensure()) return; [0, -2, -5, -9, -12].forEach((d, i) => pluck(midi(62 + d), 0.13, i * 0.35)); },

<script>

/* ================= 一年 ================= */
async function doAction(id) {

      case 'work': { const g = Math.round(rnd(25, 45) * (1 + S.st.cha * 0.05) * (1 + S.realm * 0.5)); G.stones(g); log(pick(['你在镇上酒楼端盘子', '你给镖局当趟子手', '你在药铺捣药', '你给人写家书']) + '，<span class="res">灵石+' + g + '</span>'); break; }

async function passYears(n, forceEvent) {
  S.age += n; if (S.injured > 0) S.injured = Math.max(0, S.injured - n);
  if (G.has('chi')) S.stones -= 10 * n; if (G.has('qzt')) S.stones -= 20 * n;
  if (S.stones < 0 && !G.has('szjj')) S.stones = 0;
  if (S.age >= 6 && S.age < 18 && n === 1) { const g = Math.round(S.st.wealth * 3); if (g > 0) S.stones += g; }
  updateHUD();
  const pEv = S.age < 6 ? 0.85 : 0.5 + (G.has('hl') ? 0.15 : 0);
  if (forceEvent || Math.random() < pEv) await randomEvent(forceEvent);
  if (S.alive && S.age >= lifespan()) await die('寿终正寝', '你在一个阳光很好的午后，安详地闭上了眼睛。');
}
function eligible() { return EVENTS.filter(e => { try { return (!e.once || !S.seen[e.id]) && e.cond(S, G); } catch (x) { return false; } }); }
async function randomEvent(force) {
  const list = eligible(); if (!list.length) return;
  const ws = list.map(e => e.dyn ? e.dyn(S) : e.w); const tot = ws.reduce((a, b) => a + b, 0); if (tot <= 0) return;
  let r = Math.random() * tot, ev = list[0]; for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) { ev = list[i]; break; } }
  S.seen[ev.id] = 1; await runEvent(ev);
}
async function runEvent(ev) {

    openModal('<div class="ev">' + (npc ? '<canvas id="evPic"></canvas>' : '') + '<div><div class="who">' + (npc ? npc.name : '奇遇') + '</div><div class="txt">' + text + '</div></div></div><div class="choices" id="evCh"></div>', false);
    if (npc) R.portrait($('evPic'), npc);
    const box = $('evCh'); ev.choices.forEach(c => { const b = document.createElement('button'); b.className = 'btn ghost'; b.textContent = c.t; bind(b, () => res(c)); box.appendChild(b); });
  });

  const out = await choice.f(S, G);

  if (S.alive) await new Promise(res => { openModal('<div class="ev">' + (npc ? '<canvas id="evPic"></canvas>' : '') + '<div><div class="who">' + (npc ? npc.name : '奇遇') + '</div><div class="result">' + (out || '无事发生') + '</div></div></div><div class="choices"><button class="btn" id="evOk">知道了</button></div>', false); if (npc) R.portrait($('evPic'), npc); bind('evOk', () => { closeModal(); res(); }); });

/* ================= 斗法 ================= */
const PROJ = { slime: 'orb', paper: 'talisman', beast: 'fire', rock: 'orb', fox: 'fire', collector: 'talisman', rival: 'sword', boss: 'orb' };
async function battle(kind, mul, name) {
  const P = PL; if (!P) return Math.random() < 0.5;
  const myPow = power(), enPow = myPow * mul * rnd(0.8, 1.2);
  let myHp = myPow * 5.5, enHp = enPow * 5;
  // 先模拟
  const rounds = []; let a = myHp, b = enHp, turn = 0;
  while (a > 0 && b > 0 && turn < 14) { if (turn % 2 === 0) { const crit = Math.random() < 0.06 + S.st.luck * 0.015; const d = myPow * rnd(0.8, 1.2) * (crit ? 1.8 : 1); b -= d; rounds.push({ me: 1, d, crit }); } else { const d = enPow * rnd(0.8, 1.2); a -= d; rounds.push({ me: 0, d }); } turn++; }
  const win = b <= 0 || (a > 0 && a / myHp > b / enHp);
  // 演出
  const save = { i: P.i, j: P.j, fixed: P.fixed };
  P.fixed = true; P.i = 3.5; P.j = 6.5; P.face = 1; P.hp = myHp; P.hpMax = myHp; P.hpShow = myHp; P.hpCol = '#5fd6c0';
  const E = R.addActor({ monster: kind, i: 6.5, j: 3.5, fixed: true, face: -1, scale: kind === 'boss' ? 1.9 : 1.35, label: name, labelCol: '#ffb0b0', hp: enHp, hpMax: enHp, hpShow: enHp, shadow: kind === 'boss' ? 2 : 1.1 });
  R.ents.forEach(e => { if (e.kind === 'actor' && e !== P && e !== E) e.alpha = 0.25; });
  $('battleTag').classList.remove('hidden'); G0.fast = false;
  const tap = () => { G0.fast = true; }; document.addEventListener('pointerdown', tap);
  const ps = () => R.screenOf(P, -30), es = () => R.screenOf(E, -30);
  R.ring(...es(), '#ff6a6a', 50); await sleep(500);
  for (const rd of rounds) {
    const from = rd.me ? ps() : es(), to = rd.me ? es() : ps(), tgt = rd.me ? E : P;
    SFX.swish();
    await new Promise(res => R.proj(from, to, rd.me ? 'sword' : PROJ[kind], 0.35 / (G0.fast ? 2.5 : 1), res));
    tgt.hp = Math.max(0, tgt.hp - rd.d); tgt.flashT = 0.12; SFX.hit(); R.shake = rd.crit ? 9 : 4;
    R.burst(to[0], to[1], rd.crit ? 26 : 14, rd.me ? '#bff4ff' : '#ffb080', 70, 0.6, 2.6, 80);
    R.floatText(to[0] + rnd(-8, 8), to[1] - 26, (rd.crit ? '暴击 ' : '-') + Math.round(rd.d), rd.me ? (rd.crit ? '#ffd75e' : '#fff') : '#ff7a6a', rd.crit ? 20 : 15);
    await sleep(380);
  }
  if (win) { E.hp = Math.min(E.hp, 0); R.burst(...es(), 40, '#ffd75e', 90, 1, 3); SFX.chime(); R.floatText(es()[0], es()[1] - 50, '胜！', '#ffd75e', 26); }
  else { SFX.fail(); R.floatText(ps()[0], ps()[1] - 50, '败…', '#ff7a6a', 24); }
  for (let k = 0; k < 10; k++) { (win ? E : P).alpha = 1 - k / 12; await sleep(60); }
  await sleep(300);
  document.removeEventListener('pointerdown', tap); G0.fast = false; $('battleTag').classList.add('hidden');
  R.ents.splice(R.ents.indexOf(E), 1); P.alpha = null; Object.assign(P, save); delete P.hp; delete P.hpMax;
  R.ents.forEach(e => { if (e.kind === 'actor') e.alpha = null; });
  return win;
}

/* ================= 突破 / 天劫 ================= */
function breakChance() {
  const r = REALMS[S.realm]; let p = r.rate + S.st.int * 0.012 + S.st.luck * 0.006 + (S.injured > 0 ? -0.15 : 0); const pills = [];
  if (S.realm === 1 && S.items.zjd) { p += 0.3 * (1 + G.mod('pill')); pills.push('zjd'); }
  if (S.items.pjd) { p += 0.15 * (1 + G.mod('pill')); pills.push('pjd'); }
  if (REALMS[S.realm + 1].trib) p += G.mod('trib') + (LINGGEN[S.ling].trib || 0) + (S.tribBonus || 0);
  return { p: Math.max(0.05, Math.min(0.97, p)), pills };
}
async function doBreak() {
  if (busy || !canBreak()) return;
  if (S.realm === 0 && !S.flags.manual) { toast('没有功法，不知道怎么突破……<br>（拜入宗门/拜师/淘个秘籍）'); return; }
  const { p, pills } = breakChance(), next = REALMS[S.realm + 1];
  const ok = await new Promise(res => { openModal('<div class="ptitle">' + (S.realm === 6 ? '白日飞升' : '冲击' + next.n) + '</div><div class="big">当前成功率：<b style="color:#b8402a;font-size:22px">' + Math.round(p * 100) + '%</b><br>' + (pills.length ? '将服用：' + pills.map(x => ITEMS[x].n).join('、') + '<br>' : '') + (next.trib ? '<span style="color:#7a2a12">※ 需渡 ' + next.trib + ' 道天劫！失败可能身死道消</span><br>' : '失败会损失修为并受伤<br>') + (S.realm === 6 ? '<span style="color:#7a2a12">天道正在门口等你结尾款……</span>' : '') + '</div><div class="row2"><button class="btn ghost" id="bkNo">再等等</button><button class="btn gold" id="bkGo">冲！</button></div>'); bind('bkNo', () => { closeModal(); res(false); }); bind('bkGo', () => { closeModal(); res(true); }); });
  if (!ok) return; busy = true;
  try {
    pills.forEach(x => G.item(x, -1));
    const success = Math.random() < p; PL.fixed = true; PL.i = 4.5; PL.j = 5.5; const P = R.screenOf(PL, -30);
    log('你开始冲击' + next.n + '……');
    if (next.trib) {
      R.darken = 1; SFX.thunder(); await sleep(1200); const n = next.trib;
      for (let k = 0; k < n; k++) {
        const last = k === n - 1; SFX.thunder(); R.bolt(P[0], P[1] + 20); R.burst(P[0], P[1] + 10, 30, '#d8d0ff', 120, 0.7, 3, 100);
        R.floatText(P[0] + [-50, 50, 0][k % 3], P[1] - 60 - (k % 3) * 16, '第' + (k + 1) + '道', '#e0d8ff', 16); PL.flashT = 0.15;
        if (last && !success) R.shake = 20;
        await sleep(last ? 900 : 650 - Math.min(300, n * 20));
      }
      if (S.realm === 6 && success) { // 最终boss
        log('天劫散去，一朵算盘形状的云飘了下来——<span class="gold">讨尾款的天道</span>现身了！');
        R.darken = 0.4; const win = await battle('boss', 1.0, '讨尾款的天道');
        if (!win) { R.darken = 0; S.injured = 5; S.exp *= 0.5; log('<span class="bad">你被天道一算盘拍回人间。修为大损，负伤五年。</span>'); banner('飞升失败', '天道：尾款结清了再来'); SFX.fail(); return; }
      }
      R.darken = 0;
    } else { R.ring(P[0], P[1] + 20, '#ffd75e', 80, 1); R.burst(P[0], P[1], 30, '#ffe9a0', 60, 1.2, 2.5, -20); await sleep(900); }
    if (success) {
      S.realm++; S.stage = 0; S.exp = 0; if (S.realm > (META_S.best || 0)) { META_S.best = S.realm; saveMeta(); }
      R.flash = 0.9; R.flashCol = '#fff6c0'; SFX.levelup(); for (let k = 0; k < 3; k++) R.ring(P[0], P[1] + 20, '#ffd75e', 90 + k * 40, 1 + k * 0.3); R.burst(P[0], P[1], 80, '#ffd75e', 140, 1.6, 3.2, 40);
      if (S.realm === 7) { log('<span class="gold">天道收下尾款，金光大道铺开。你踏云而上——白日飞升！</span>'); banner('白日飞升！', '恭喜还清天道尾款'); refreshPlayerLook(); await sleep(2600); await die('飞升', '你飞升仙界，成为了一名……仙界的打工人。', true); return; }
      log('<span class="gold">突破成功！你晋入' + realmName() + '，寿元大增！</span>'); banner('突破成功', realmName());
      if (S.realm === 1) G.unlock('secret');
    } else {
      SFX.fail();
      if (next.trib) {
        if (S.items.tsf) { G.item('tsf', -1); S.injured = 5; S.exp *= 0.4; log('<span class="bad">天劫将你劈得外焦里嫩，替死符化为灰烬，保住了你一条小命。</span>'); banner('渡劫失败', '替死符救了你一命'); }
        else if (G.has('bsxq') && !S.revived) { S.revived = 1; S.injured = 5; S.exp = 0; log('<span class="bad">你被雷劈成了焦炭……然后焦炭动了一下。不死小强发动！</span>'); banner('渡劫失败', '不死小强：又活了'); }
        else if (G.roll(0.45 + S.st.luck * 0.03)) { S.injured = 6; S.exp = 0; G.life(-Math.round(lifespan() * 0.1)); log('<span class="bad">天劫失败，你重伤濒死，侥幸活了下来。修为尽散，寿元大损。</span>'); banner('渡劫失败', '侥幸未死'); }
        else { await die('渡劫失败', '第' + next.trib + '道天雷落下，你化作了一缕青烟。天道在小本本上划掉了你的名字。'); return; }
      } else { S.exp *= 0.6; S.injured = 2; log('<span class="bad">突破失败！真气逆行，修为受损，负伤两年。</span>'); banner('突破失败', '道心受挫'); }
    }
  } finally { busy = false; R.darken = 0; if (PL) PL.fixed = false; if (S && S.alive) { updateHUD(); saveLife(); } }
}

/* ================= 死亡与结算 ================= */
async function die(cause, text, ascended) {
  if (!S.alive) return;
  if (!ascended && cause !== '寿终正寝' && G.has('bsxq') && !S.revived) { S.revived = 1; log('<span class="gold">你本该死了，但不死小强发动，你又爬了起来！</span>'); return; }
  S.alive = false; S.cause = cause; log('<span class="bad">' + text + '</span>'); saveLife();
  if (!ascended) { SFX.death(); if (PL) { PL.mood = 'sad'; for (let k = 0; k < 10; k++) { PL.alpha = 1 - k / 10; await sleep(80); } } }
  const pts = Math.round(S.age / 10 + S.realm * S.realm * 3 + S.realm * 3 + S.kills * 0.3 + (S.fame || 0) * 2 + (ascended ? 60 : 0) + 3);
  META_S.pts += pts; META_S.n++; META_S.lives.unshift({ n: META_S.n, name: S.name, age: S.age, realm: realmName(), cause, ling: LINGGEN[S.ling].n }); META_S.lives = META_S.lives.slice(0, 30); saveMeta();
  try { localStorage.removeItem(LS_LIFE); } catch (e) {}
  const grade = ascended ? 'SSS' : ['D', 'C', 'B', 'A', 'S', 'S+', 'SS'][S.realm];
  const comment = ascended ? '还清尾款，位列仙班。落魄剑仙在下界为你烧了一壶好酒。' : ['平凡的一生，也是一生。至少你种的萝卜很甜。', '踏入了仙途，但仙途太长，腿太短。', '筑基有成，在村里吹了一辈子。', '金丹修士，一方高人，就是有点穷。', '元婴老怪，小孩子听到你的名字都不敢哭。', '化神大能，离飞升只差几笔尾款。', '渡劫期！就差最后一哆嗦！'][S.realm];
  await sleep(600);
  $('dTitle').textContent = ascended ? '飞升成仙' : '此生已尽';
  $('dBody').innerHTML = '<div class="grade">' + grade + '</div><div class="big" style="text-align:center;margin-bottom:8px">' + comment + '</div>' +
    [['姓名', S.name], ['灵根', LINGGEN[S.ling].n], ['享年', S.age + ' 岁'], ['境界', realmName()], ['死因', cause], ['斩妖', S.kills + ' 只'], ['天赋', S.talents.map(t => TALENTS.find(x => x.id === t).n).join('、')]].map(([k, v]) => '<div class="kv"><span>' + k + '</span><b>' + v + '</b></div>').join('') +
    '<div class="big" style="text-align:center;margin-top:10px">获得 <b style="color:#b8402a;font-size:24px">' + pts + '</b> 轮回点（共 ' + META_S.pts + '）</div>';
  showScreen('deathScr');
}

/* ================= 行囊 / 商店 / 地图 / 菜单 ================= */
function bagModal() {
  const ks = Object.keys(S.items);
  openModal('<div class="ptitle">行囊</div><div class="list">' + (ks.length ? ks.map(k => '<div class="it"><div><div class="nm">' + ITEMS[k].n + ' ×' + S.items[k] + '</div><div class="ds">' + ITEMS[k].d + '</div></div>' + (['hcd', 'ysd', 'pyd'].includes(k) ? '<button class="btn sm" data-use="' + k + '">使用</button>' : '') + '</div>').join('') : '<div class="hint" style="padding:20px">空空如也，跟你的钱袋一样</div>') +
    '</div><div class="ptitle s">天赋</div>' + S.talents.map(id => { const t = TALENTS.find(x => x.id === id); return '<div class="card"><div class="gem" style="background:' + RCOL[t.r] + '">' + t.n[0] + '</div><div><div class="tn">' + t.n + '</div><div class="td">' + t.d + '</div></div></div>'; }).join('') +
    '<div class="row2"><button class="btn" id="bagX">关闭</button></div>');
  bind('bagX', closeModal);
  document.querySelectorAll('[data-use]').forEach(b => bind(b, () => { const k = b.dataset.use, pm = 1 + G.mod('pill'); G.item(k, -1);
    if (k === 'hcd') { S.injured = 0; G.life(Math.round(5 * pm)); log('你服下回春丹，伤势痊愈。'); } if (k === 'ysd') { G.life(Math.round(30 * pm)); log('你服下延寿丹，<span class="res">寿元+' + Math.round(30 * pm) + '</span>'); } if (k === 'pyd') { G.cultYear(1.5 * pm); log('你服下培元丹，修为大涨。'); }
    SFX.chime(); updateHUD(); saveLife(); bagModal(); }));
}
function price(k) { return Math.round(ITEMS[k].p * (1 + S.realm * 0.25) * (1 - Math.min(0.3, S.st.cha * 0.02))); }
function shopModal() {
  return new Promise(done => {
    const draw = () => { openModal('<div class="ev"><canvas id="evPic"></canvas><div><div class="who">奸商·钱多多</div><div class="txt">“童叟无欺，假一赔……再说吧。”<br>你有灵石：<b>' + S.stones + '</b></div></div></div><div class="list">' + SHOP.map(k => '<div class="it"><div><div class="nm">' + ITEMS[k].n + '</div><div class="ds">' + ITEMS[k].d + '</div></div><button class="btn gold sm" data-buy="' + k + '">' + price(k) + '</button></div>').join('') + '</div><div class="row2"><button class="btn" id="shX">离开</button></div>');
      R.portrait($('evPic'), NPC.merchant); bind('shX', () => { closeModal(); done(); });
      document.querySelectorAll('[data-buy]').forEach(b => bind(b, () => { const k = b.dataset.buy, p = price(k);
        if (S.stones < p && !G.has('szjj')) { toast('灵石不够！（赊账剑诀可以欠账）'); return; }
        if (G.has('bphy') && G.roll(0.25)) { toast('白嫖护体发动！老板忘记收钱了'); } else { S.stones -= p; if (S.stones < 0) S.debtHeat = (S.debtHeat || 0) + 1; }
        G.item(k, 1); SFX.coin(); updateHUD(); saveLife(); draw(); })); };
    draw(); modalClose = () => { closeModal(); done(); };
  });
}
function mapModal() {
  openModal('<div class="ptitle">云游四方</div>' + Object.entries(LOCS).map(([k, L]) => { const ok = L.ok(); return '<div class="loc ' + (k === S.loc ? 'cur' : '') + (ok ? '' : ' lock') + '" data-loc="' + k + '"><div><div class="ln">' + L.n + (k === S.loc ? '（当前）' : '') + '</div><div class="ld">' + (ok ? L.d : '【未解锁】' + L.lock) + '</div></div></div>'; }).join('') + '<div class="row2"><button class="btn" id="mpX">关闭</button></div>');
  bind('mpX', closeModal);
  document.querySelectorAll('[data-loc]').forEach(el => bind(el, () => { const k = el.dataset.loc; if (!LOCS[k].ok()) { toast(LOCS[k].lock); return; } if (k === S.loc) { closeModal(); return; } closeModal(); travel(k); }));
}
async function travel(k) { await fade(() => { S.loc = k; R.setMap(k); populate(k); updateHUD(); saveLife(); }); banner(LOCS[k].n); log('你来到了' + LOCS[k].n + '。'); }
function menuModal() {
  openModal('<div class="ptitle">菜单</div><div class="menu" style="margin:10px auto">' +
    '<button class="btn" id="mnBack">继续游戏</button><button class="btn ghost" id="mnMusic">音乐：' + (SFX.musicOn ? '开' : '关') + '</button><button class="btn ghost" id="mnHelp">玩法说明</button><button class="btn red" id="mnTitle">回到标题</button><button class="btn red sm" id="mnSuicide">兵解重修（结束此生）</button></div>');
  bind('mnBack', closeModal); bind('mnMusic', () => { SFX.setMusic(!SFX.musicOn); menuModal(); }); bind('mnHelp', helpModal);
  bind('mnTitle', () => { closeModal(); saveLife(); toTitle(); });
  bind('mnSuicide', () => { closeModal(); if (!busy) die('兵解', '你觉得这辈子开局不好，果断兵解，重入轮回。'); });
}
function helpModal() {
  openModal('<div class="ptitle">玩法</div><div class="big">' +
    '① 投胎：抽 3 个天赋、分配先天属性、摸出灵根。<br>② 每次点一个<b>行动</b>就过一年（闭关会过好几年），随机触发奇遇事件。<br>③ 修为满了点<b>突破</b>：凡人→练气→筑基→金丹→元婴→化神→渡劫→<b>飞升</b>。金丹起要渡天劫！<br>④ 用<b>地图</b>去不同地方：宗门修炼快，坊市能赚钱买丹药，秘境斩妖掉宝。<br>⑤ 寿元耗尽或渡劫失败就会死。死后获得<b>轮回点</b>，在轮回殿永久变强，再来一世。<br>⑥ 斗法自动进行，点击屏幕可加速。<br><br>终极目标：还清天道的尾款，白日飞升！</div><div class="row2"><button class="btn" id="hpX">明白了</button></div>');
  bind('hpX', closeModal);
}
function metaModal() {
  const draw = () => { openModal('<div class="ptitle">轮回殿 <small>轮回点：<b>' + META_S.pts + '</b></small></div><div class="hint">孟婆汤可以不喝，但轮回点要花</div><div class="list">' +
    META.map(m => { const l = mlv(m.id), max = l >= m.max; return '<div class="it"><div><div class="nm">' + m.n + ' <small>Lv' + l + '/' + m.max + '</small></div><div class="ds">' + m.d + '</div></div><button class="btn gold sm" data-m="' + m.id + '" ' + (max ? 'disabled' : '') + '>' + (max ? '已满' : m.cost(l)) + '</button></div>'; }).join('') + '</div><div class="row2"><button class="btn" id="mtX">关闭</button></div>');
    bind('mtX', () => { closeModal(); updateTitle(); });
    document.querySelectorAll('[data-m]').forEach(b => bind(b, () => { const m = META.find(x => x.id === b.dataset.m), l = mlv(m.id), c = m.cost(l); if (l >= m.max) return; if (META_S.pts < c) { toast('轮回点不足，再去死几次吧'); return; } META_S.pts -= c; META_S.lv[m.id] = l + 1; saveMeta(); SFX.chime(); draw(); })); };
  draw();
}
function histModal() {
  openModal('<div class="ptitle">往世录</div><div class="hint">共轮回 ' + META_S.n + ' 世 · 最高境界：' + REALMS[META_S.best || 0].n + '</div><div class="list">' + (META_S.lives.length ? META_S.lives.map(l => '<div class="it"><div><div class="nm">第' + l.n + '世 · ' + l.name + '</div><div class="ds">' + l.ling + ' · 享年' + l.age + ' · ' + l.realm + ' · ' + l.cause + '</div></div></div>').join('') : '<div class="hint" style="padding:20px">还没有前世。你是一张白纸。</div>') + '</div><div class="row2"><button class="btn" id="hsX">关闭</button></div>');
  bind('hsX', closeModal);
}

/* ================= 投胎 ================= */
let draft = null;
function newDraft() {
  const n = 8 + mlv('cand'), pool = TALENTS.slice().sort(() => Math.random() - 0.5);
  // 稀有度加权：金色较少
  const cands = []; for (const t of pool) { if (cands.length >= n) break; if (t.r === 3 && Math.random() < 0.55) continue; cands.push(t.id); }
  while (cands.length < n) { const t = pick(TALENTS).id; if (!cands.includes(t)) cands.push(t); }
  draft = { cands, sel: [], rerolls: 1 + mlv('reroll'), name: randName(), ling: null, st: { con: 0, int: 0, luck: 0, cha: 0, wealth: 0 }, pts: 20 + mlv('pts') * 2 };
  randStats();
}
function randStats() { const st = draft.st; for (const k in st) st[k] = 0; let p = draft.pts; while (p > 0) { const k = pick(Object.keys(st)); if (st[k] < 10) { st[k]++; p--; } } }
function rollLing() { let w = LINGGEN.map(l => l.w), lim = mlv('root') ? 3 : 6; let tot = 0; for (let i = 0; i <= lim; i++) tot += w[i]; let r = Math.random() * tot; for (let i = 0; i <= lim; i++) { r -= w[i]; if (r <= 0) return i; } return lim; }
function drawTalents() {
  const L = $('talentList'); L.innerHTML = '';
  draft.cands.forEach(id => { const t = TALENTS.find(x => x.id === id), d = document.createElement('div'); d.className = 'card r' + t.r + (draft.sel.includes(id) ? ' sel' : '');
    d.innerHTML = '<div class="gem" style="background:' + RCOL[t.r] + '">' + t.n[0] + '</div><div><div class="tn" style="color:' + (t.r ? RCOL[t.r] : '#555') + '">' + t.n + '</div><div class="td">' + t.d + '</div></div>';
    bind(d, () => { const i = draft.sel.indexOf(id); if (i >= 0) draft.sel.splice(i, 1); else if (draft.sel.length < 3) draft.sel.push(id); else { draft.sel.shift(); draft.sel.push(id); } drawTalents(); }); L.appendChild(d); });
  $('bReroll').textContent = '刷新(' + draft.rerolls + ')'; $('bReroll').disabled = draft.rerolls <= 0; $('bTalentOk').disabled = draft.sel.length < 3;
}
function drawStats() {
  $('nameV').textContent = draft.name; const used = Object.values(draft.st).reduce((a, b) => a + b, 0); $('ptsV').textContent = draft.pts - used;
  if (draft.ling != null) { const l = LINGGEN[draft.ling]; $('lingV').innerHTML = '<span style="color:' + l.col + ';text-shadow:0 1px 0 #333">' + l.n + '</span>'; $('lingD').textContent = l.d + '（修炼×' + l.mul + '）'; $('bLing').classList.add('hidden'); }
  else { $('lingV').textContent = '？？？'; $('lingD').textContent = '点“摸骨”看看你的灵根'; $('bLing').classList.remove('hidden'); }
  $('statList').innerHTML = STATS.map(([k, n, d]) => '<div class="srow"><span class="sn">' + n + '</span><span class="sd">' + d + '</span><button class="btn ghost" data-s="' + k + '" data-d="-1">−</button><span class="sv">' + draft.st[k] + '</span><button class="btn ghost" data-s="' + k + '" data-d="1">＋</button></div>').join('');
  document.querySelectorAll('[data-s]').forEach(b => bind(b, () => { const k = b.dataset.s, d = +b.dataset.d, used = Object.values(draft.st).reduce((a, c) => a + c, 0); if (d > 0 && (used >= draft.pts || draft.st[k] >= 10)) return; if (d < 0 && draft.st[k] <= 0) return; draft.st[k] += d; drawStats(); }));
}
async function lingAnim() {
  const v = $('lingV'); for (let k = 0; k < 14; k++) { const l = LINGGEN[(Math.random() * 7) | 0]; v.innerHTML = '<span style="color:' + l.col + '">' + l.n + '</span>'; SFX.click(); await new Promise(r => setTimeout(r, 50 + k * 12)); }
  draft.ling = rollLing(); drawStats(); draft.ling <= 1 ? SFX.levelup() : SFX.chime();
}
function born() {
  if (draft.ling == null) draft.ling = rollLing();
  const st = Object.assign({}, draft.st); for (const id of draft.sel) { const t = TALENTS.find(x => x.id === id); if (t.s) for (const k in t.s) st[k] = Math.max(0, st[k] + t.s[k]); }
  S = { v: 1, name: draft.name, age: 0, ling: draft.ling, st, talents: draft.sel.slice(), realm: 0, stage: 0, exp: 0, stones: st.wealth * 25 + mlv('gold') * 100, lifeBonus: 0, loc: 'village', unlocked: { village: 1 }, flags: {}, items: {}, injured: 0, log: [], seen: {}, kills: 0, fame: 0, alive: true,
    look: { hair: pick(['#2a1b14', '#1a1a2a', '#4a2a1a', '#3a2a4a']), ribbon: pick(['#ff5a6a', '#5a8fd8', '#ffd75e', '#9be15d', '#c07aff']), long: Math.random() < 0.5 } };
  if (S.stones > 0 && G.has('fed')) S.stones += 100;
  if (G.has('luox')) S.flags.mentor = 1;
  startLife(true);
}
async function startLife(fresh) {
  await fade(() => { showScreen('game'); R.setMap(S.loc); populate(S.loc); renderLog(); updateHUD(); });
  if (fresh) { log('你出生在桃花村一户' + (S.st.wealth >= 7 ? '富裕的地主' : S.st.wealth >= 4 ? '普通的农' : '穷得叮当响的') + '人家。接生婆说你哭声嘹亮，' + pick(['像个讨债的。', '必成大器。', '吵死了。']) + '<span class="res">（' + LINGGEN[S.ling].n + '）</span>'); saveLife(); }
  else log('<span class="res">（前尘未了，继续此生）</span>');
}

/* ================= 标题 ================= */
function updateTitle() {
  const L = loadLife(); $('bContinue').style.display = L && L.alive ? '' : 'none';
  if (L && L.alive) $('bContinue').textContent = '继续此生 · ' + L.name + ' ' + L.age + '岁';
  $('metaLine').textContent = META_S.n ? '已轮回 ' + META_S.n + ' 世 · 轮回点 ' + META_S.pts + ' · 最高 ' + REALMS[META_S.best || 0].n : '仙途漫漫，不如……先投个胎';
  $('bMusic').textContent = '音乐：' + (SFX.musicOn ? '开' : '关');
}
function toTitle() { fade(() => { S = null; showScreen('title'); R.setMap('village'); populate('village'); updateTitle(); }); }

/* ================= 绑定 ================= */
bind('bNew', () => { newDraft(); drawTalents(); showScreen('talentScr'); });
bind('bContinue', () => { const L = loadLife(); if (!L) return; S = L; startLife(false); });
bind('bMeta', metaModal); bind('bHist', histModal); bind('bHelp', helpModal);
bind('bMusic', () => { SFX.setMusic(!SFX.musicOn); updateTitle(); });
bind('bReroll', () => { if (draft.rerolls <= 0) return; draft.rerolls--; const keep = draft.sel.slice(); const r = draft.rerolls; const nm = draft.name; newDraft(); draft.rerolls = r; draft.name = nm; draft.sel = []; drawTalents(); });
bind('bTalentOk', () => { if (draft.sel.length < 3) return; drawStats(); showScreen('statScr'); });
bind('bName', () => { draft.name = randName(); drawStats(); });
bind('bLing', lingAnim);
bind('bRand', () => { randStats(); drawStats(); });
bind('bBorn', () => { const used = Object.values(draft.st).reduce((a, b) => a + b, 0); if (used < draft.pts) { toast('还有 ' + (draft.pts - used) + ' 点属性没分配哦'); return; } SFX.gong(); born(); });
bind('bMenu', menuModal); bind('bMap', () => { if (!busy) mapModal(); }); bind('bBag', () => { if (!busy) bagModal(); }); bind('bBreak', doBreak);
bind('dAgain', () => { newDraft(); drawTalents(); showScreen('talentScr'); R.setMap('village'); populate('village'); });
bind('dMeta', metaModal);
window.onAndroidBack = () => { if (!$('modal').classList.contains('hidden')) { if (modalClose) modalClose(); return true; } if ($('hud').classList.contains('hidden')) { if ($('title').classList.contains('on')) return false; toTitle(); return true; } if (!busy) menuModal(); return true; };
window.onAppPause = () => { SFX.suspend(); saveLife(); }; window.onAppResume = () => SFX.resume();
document.addEventListener('visibilitychange', () => { if (document.hidden) { SFX.suspend(); saveLife(); } else SFX.resume(); });

R.init($('cv'));
populate('village'); showScreen('title'); updateTitle();
window.__wbx = { get S() { return S; }, G, R, doAction, doBreak, battle, runEvent, travel, META: () => META_S }; // 调试/测试用

</script>
</body>
</html>
