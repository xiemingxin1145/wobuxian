plugins { id 'com.android.application' }

// 版本号：CI 通过环境变量注入；本地默认读取根目录 VERSION
def verName = System.getenv('WBX_VERSION_NAME') ?: new File(rootDir, '../VERSION').text.trim()
def verCode = (System.getenv('WBX_VERSION_CODE') ?: '3').toInteger()
// 签名：优先使用环境变量指定的 keystore（CI 从 Secrets 解码而来），否则使用本机 ~/.android/debug.keystore
// 两者是同一把钥匙，保证新版本可以覆盖安装旧版本。
def ksPath = System.getenv('WBX_KEYSTORE') ?: "${System.getProperty('user.home')}/.android/debug.keystore"

android {
    namespace 'com.wobuxian.game'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.wobuxian.game'
        minSdk 24
        targetSdk 35
        versionCode verCode
        versionName verName
    }
    signingConfigs {
        wbx {
            storeFile file(ksPath)
            storePassword System.getenv('WBX_KEYSTORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('WBX_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('WBX_KEY_PASSWORD') ?: 'android'
        }
    }
    buildTypes {
        debug { minifyEnabled false; signingConfig signingConfigs.wbx }
        release { minifyEnabled false; signingConfig signingConfigs.wbx }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    aaptOptions { noCompress 'html','js','css','webp','ogg','png' }
}
