<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>随机奇遇链小闭环原型（船夫 / 乞丐 / 算命 / 小贩 / 更夫）</title>
  <style>
    body { margin: 20px; background: #101b25; color: #f1e1c8; font: 15px/1.6 sans-serif; max-width: 640px; }
    h1 { font-size: 18px; }
    .card { background: #1d2a22; padding: 14px; border-radius: 8px; margin: 12px 0; }
    button { margin: 4px 6px 4px 0; padding: 8px 14px; background: #2a5a3a; color: #b0ffb0; border: 1px solid #b0ffb0; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    .log { font-size: 13px; opacity: .85; white-space: pre-wrap; }
    .stat { color: #ffe680; }
    select { margin: 6px 0; padding: 4px; }
  </style>
</head>
<body>
  <h1>随机奇遇链小闭环原型</h1>
  <div class="tip">隔离演示，不接入正式任务栏 / 存档。选择影响模拟恩怨值与债务。</div>
  <label>当前链：
    <select id="chain" onchange="loadChain()">
      <option value="chuanfu">渡口船夫·过河欠条</option>
      <option value="qigai">乞丐讨饭钱</option>
      <option value="suanming">算命先生·拾骨费</option>
      <option value="xiaofan">小贩讨货钱</option>
      <option value="gengfu">更夫讨更钱</option>
    </select>
  </label>

  <div class="card" id="encounter"></div>
  <div class="card" id="result" style="display:none;"></div>

  <div class="card">
    <div class="stat" id="stats">恩怨值 rel: 0 | 债务上涨: 0%</div>
    <div class="log" id="log"></div>
    <button onclick="reset()">重置再演</button>
  </div>

  <script>
    'use strict';
    const CHAINS = {
      chuanfu: {
        name: '船夫',
        meet: '渡口船夫走过来，拱手说：「少侠，能帮我把这封信送到邻图吗？或者先付过河费？」',
        opts: [
          { id: 'help', label: '帮忙送信', rel: 20, debt: 0, msg: '你帮忙送信到邻图。船夫感激：「下次过河免费一次！」', cons: '后果：船夫 rel +20；触发报恩小事件（可得灵石）。' },
          { id: 'refuse', label: '拒绝', rel: -15, debt: 0, msg: '你拒绝了。船夫冷唾：「行吧，下次贵点。」', cons: '后果：rel -15；船夫记仇，年度模拟可能刷寻仇来客。' },
          { id: 'debt', label: '赖账（欠条不还）', rel: 0, debt: 8, msg: '你拿了欠条却赖账不还。船夫怒目而视。', cons: '后果：债务 +8%；下一世可能被追债司找上门。' },
        ]
      },
      qigai: {
        name: '乞丐',
        meet: '路边乞丐伸着破碗，沙哑道：「少侠，赏口饭钱吧……」',
        opts: [
          { id: 'give', label: '给灵石', rel: 10, debt: 0, msg: '你丢了几块灵石。乞丐连连磕头：「下次有事我报恩！」', cons: '后果：乞丐 rel +10；可能触发小报恩（情报或灵石）。' },
          { id: 'later', label: '推说下回定', rel: 0, debt: 0, msg: '你摆摆手：「下回再说。」乞丐应了声，继续蹲着。', cons: '后果：无变化。' },
          { id: 'ignore', label: '无视', rel: -5, debt: 0, msg: '你径直走过。乞丐在背后嘟咕了几句。', cons: '后果：rel -5；可能传闲话。' },
        ]
      },
      suanming: {
        name: '算命先生',
        meet: '街边算命先生摇着签筒，喊道：「少侠，来拾一卦吧？签说今日有缘。」',
        opts: [
          { id: 'pay', label: '付算命钱', rel: 12, debt: 0, msg: '你付了算命钱。先生摇签说了句虚词，并退了一点灵石。', cons: '后果：先生 rel +12；可得一句虚词或小量灵石返还。' },
          { id: 'later', label: '推说下回定', rel: 0, debt: 0, msg: '你说：「下回再来吧。」先生点点头，继续摇签。', cons: '后果：无变化。' },
          { id: 'ignore', label: '无视', rel: -8, debt: 0, msg: '你不理他。先生在背后说了句凶识。', cons: '后果：rel -8；可能后续传出凶识。' },
        ]
      },
      xiaofan: {
        name: '小贩',
        meet: '路边小贩摆着货柜，招手道：「少侠，这批货的钱还没结，讨要一下。」',
        opts: [
          { id: 'pay', label: '付清货钱', rel: 8, debt: 0, msg: '你付清了货钱。小贩乐哈哈送了点小便宜。', cons: '后果：小贩 rel +8；可得一点小便宜。' },
          { id: 'later', label: '推说下回定', rel: 0, debt: 0, msg: '你说：「下回定。」小贩点头，继续摆摊。', cons: '后果：无变化。' },
          { id: 'ignore', label: '无视', rel: -6, debt: 0, msg: '你不理他。小贩在背后说你货不值。', cons: '后果：rel -6；可能传言货不值。' },
        ]
      },
      gengfu: {
        name: '更夫',
        meet: '夜间更夫提着灯笼，走过来道：「少侠，讨要一点更钱吧，今夜巡了几回。」',
        opts: [
          { id: 'pay', label: '付清更钱', rel: 9, debt: 0, msg: '你付了更钱。更夫点头：「夜安，少侠。」', cons: '后果：更夫 rel +9；可得一句安民话。' },
          { id: 'later', label: '推说下回定', rel: 0, debt: 0, msg: '你说：「下回定。」更夫应了声，提灯继续走。', cons: '后果：无变化。' },
          { id: 'ignore', label: '无视', rel: -7, debt: 0, msg: '你不理他。更夫在背后嘴嘟了几句。', cons: '后果：rel -7；可能夜间传闲话。' },
        ]
      }
    };
    let rel = 0, debtUp = 0, current = 'chuanfu';
    const logEl = document.getElementById('log');
    const statsEl = document.getElementById('stats');
    const resultEl = document.getElementById('result');
    const encEl = document.getElementById('encounter');
    const chainSel = document.getElementById('chain');

    function log(msg) { logEl.textContent += msg + '\n'; }
    function updateStats() {
      const nm = CHAINS[current].name;
      statsEl.textContent = `恩怨值 rel: ${rel}（${nm}） | 债务上涨: ${debtUp}%`;
    }
    function loadChain() {
      current = chainSel.value;
      reset(true);
    }
    function renderEncounter() {
      const c = CHAINS[current];
      let html = `<b>遇见</b>：${c.meet}<div style="margin-top:10px;">`;
      c.opts.forEach(o => {
        html += `<button onclick="choose('${o.id}')">${o.label}</button>`;
      });
      html += '</div>';
      encEl.innerHTML = html;
      encEl.style.display = 'block';
    }
    function choose(act) {
      const c = CHAINS[current];
      const o = c.opts.find(x => x.id === act);
      if (!o) return;
      encEl.style.display = 'none';
      rel += o.rel;
      debtUp += o.debt;
      resultEl.style.display = 'block';
      resultEl.innerHTML = `<b>选择结果</b><br>${o.msg}<br><br>${o.cons}`;
      log(`选择：${o.label} → ${o.msg}`);
      updateStats();
    }
    function reset(keepChain) {
      rel = 0; debtUp = 0;
      logEl.textContent = '';
      resultEl.style.display = 'none';
      if (!keepChain) chainSel.value = current;
      renderEncounter();
      updateStats();
      log('重置完成，可再次触发奇遇。');
    }
    renderEncounter();
  </script>
</body>
</html>
