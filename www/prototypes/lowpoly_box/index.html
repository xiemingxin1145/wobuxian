<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>方块低模角色 · 预览（开放世界线原型）</title>
  <style>
    body { margin: 0; background: #101b25; color: #f1e1c8; font: 14px sans-serif; }
    header { padding: 10px 14px; }
    canvas { display: block; width: 100%; max-width: 820px; margin: 0 auto; background: #1d2a22; }
    .tip { opacity: .7; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <b>方块低模角色预览</b>（含扩展：路人甲 / 主角男 / 散修 / 宗门弟子 / 药贩）· 每行一个角色：四向待机 + 行走 / 挥砍 / 受击
    <div class="tip">Canvas 现画长方体，零贴图；不接入正式游戏。点画面切换缩放。</div>
    <select id="who" style="margin-top:6px;">
      <option value="jianxiu">主角：青衫剑修</option>
      <option value="nvzhu">主角：主角女</option>
      <option value="jianxian">主角：剑仙</option>
      <option value="nanzhu">主角：主角男</option>
      <option value="luren">路人甲</option>
      <option value="chuanfu">渡口船夫</option>
      <option value="yaonong">药农</option>
      <option value="heishi">黑市商人</option>
      <option value="sanxiu">散修</option>
      <option value="zongmen">宗门弟子</option>
      <option value="yaofan">药贩</option>
    </select>
    <label style="margin-left:8px;"><input type="checkbox" id="wear"> 试穿 3.6 挂点（冠 · 佩 · 轩辕残剑 · 衣染青，只画外观）</label>
    <span id="wearOpts" style="margin-left:6px;">
      冠 <select id="guan"></select>
      佩 <select id="pei"></select>
      神器 <select id="sq"></select>
      <select id="aw"><option value="1">觉醒Ⅰ</option><option value="2">觉醒Ⅱ</option><option value="3">觉醒Ⅲ（发光壳）</option></select>
    </span>
    <button id="try" style="margin-top:6px;padding:6px 12px;background:#2a5a3a;color:#b0ffb0;border:1px solid #b0ffb0;border-radius:12px;">用方块角色试打即时战原型</button>
  </header>
  <canvas id="cv" width="820" height="640"></canvas>
  <script src="../../js/lowpoly_box_chars.js"></script>
  <script src="../../js/lowpoly_extra_chars.js"></script>
  <script src="../../js/battle_realtime_prototype.js"></script>
  <script>
    'use strict';
    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    // 合并扩展角色（路人甲 / 主角男 / 散修等）
    if (window.LowpolyExtra) {
      Object.assign(LowpolyBox.CHARS, LowpolyExtra);
      LowpolyBox.ids = Object.keys(LowpolyBox.CHARS);
    }
    // 每行一个角色；列：四向待机 + 面向右的 行走 / 挥砍 / 受击 + 面向下挥砍
    const COLS = [['idle', 0, 1, '待机·下'], ['idle', 1, 0, '待机·右'], ['idle', 0, -1, '待机·上'], ['idle', -1, 0, '待机·左'],
      ['walk', 1, 0, '行走·右'], ['attack', 1, 0, '挥砍·右'], ['hurt', 1, 0, '受击·右'], ['attack', 0, 1, '挥砍·下']];
    // 第 29 轮：冠 4 款 / 佩 4 款下拉（选项从 LowpolyBox.ATTACH 按槽位生成）+ 神器觉醒等级（Ⅲ 出发光壳）
    // 第 30 轮：神器 5 把下拉（sq 槽位），默认轩辕残剑
    for (const slot of ['guan', 'pei', 'sq']) {
      const sel = document.getElementById(slot);
      for (const [k, it] of Object.entries(LowpolyBox.ATTACH)) if (it.slot === (slot === 'sq' ? 'shenqi' : slot)) sel.add(new Option(it.name + '（' + k + '）', k));
    }
    const curWear = () => ({ guan: document.getElementById('guan').value, pei: document.getElementById('pei').value, shenqi: document.getElementById('sq').value || 'sq_xuanyuan', aw: +document.getElementById('aw').value });
    window.LowpolyPreview = { curWear };
    let scale = 1.0, t0 = performance.now();
    document.getElementById('try').onclick = () => RealtimeBattle.open([{ name: '讨债鬼差', hp: 80, x: 420, y: 200, speed: 70 }, { name: '讨债鬼差', hp: 80, x: 160, y: 160, speed: 60 }],
      { force: true, skin: 'box', boxPlayer: document.getElementById('who').value });
    cv.addEventListener('click', () => { scale = scale > 1 ? 1.0 : 1.3; });
    function frame(now) {
      const t = (now - t0) / 1000;
      ctx.fillStyle = '#1d2a22'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.font = '12px sans-serif';
      COLS.forEach(([, , , lb], ci) => { ctx.fillStyle = '#f1e1c8'; ctx.fillText(lb, 96 + ci * 92 - 20, 16); });
      LowpolyBox.ids.forEach((id, ri) => {
        const y = 135 + ri * 150;
        ctx.fillStyle = '#f1e1c8'; ctx.fillText(LowpolyBox.CHARS[id].name, 6, y - 40);
        COLS.forEach(([anim, fx, fy], ci) => {
          const x = 96 + ci * 92;
          ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x, y, 20 * scale, 8 * scale, 0, 0, 7); ctx.fill();
          const tt = anim === 'attack' || anim === 'hurt' ? (t % 1) : t;
          const dress = document.getElementById('wear').checked ? { wear: curWear(), dye: { yi: '#3f7f9f' } } : {};
          LowpolyBox.draw(ctx, id, x, y, Object.assign({ scale: scale * 0.9, angle: LowpolyBox.angleFromFace(fx, fy), anim, t: tt }, dress));
        });
      });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
