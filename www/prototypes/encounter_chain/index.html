<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>奇遇链草稿原型</title>
<style>
body { font-family: system-ui, sans-serif; background: #1a1e1c; color: #e8e0d0; padding: 2rem; max-width: 720px; margin: auto; }
h1 { color: #f0c070; }
.card { background: #2a302c; border-radius: 12px; padding: 1.2rem; margin: 1rem 0; }
.choice { display: block; width: 100%; margin: .5rem 0; padding: .8rem; background: #3a4540; border: none; border-radius: 8px; color: #fff; cursor: pointer; text-align: left; }
.choice:hover { background: #4a5a50; }
.status { font-size: .9rem; color: #a0c0a0; margin-top: 1rem; }
.switch { margin: 0 0 1rem; display: flex; gap: .5rem; flex-wrap: wrap; }
.switch button { padding: .5rem .9rem; border-radius: 8px; border: 1px solid #5a6a60; background: #2a302c; color: #e8e0d0; cursor: pointer; }
.switch button.active { background: #3a5540; border-color: #f0c070; color: #f0c070; }
</style>
</head>
<body>
<h1>随机奇遇链草稿</h1>
<p>独立原型，不接入正式游戏。选择会记录债务与好感变化。</p>
<div class="switch" id="chain-switch"></div>
<div id="app"></div>
<script>
const CHAINS = [

  {
    id: 'shanzei_1',
    title: '山贼拦路',
    text: '山口跳出个山贼抬刀：“交财不过，少侠带了多少灵石？”',
    choices: [
      { text: '给一些灵石', effects: { debt: +12, aff: { shanzei: -10 } }, next: null },
      { text: '硬拒并试探', effects: { debt: -5, aff: { shanzei: 8 } }, next: null },

    choices: [
      { text: '付清货款', effects: { debt: -14, aff: { huolang: 16 } }, next: null },
      { text: '推说下回定', effects: { debt: +9, aff: { huolang: -7 } }, next: null },
      { text: '无视走开', effects: { aff: { huolang: -9 } }, next: null }
    ]
  },
  {
    id: 'chaboshi_1',
    title: '茶博士讨茶资',
    text: '茶馆里茶博士端着托盘过来：“少侠，这壶好茶欠的茶资，这回能结一下吗？”',
    choices: [
      { text: '付清茶资', effects: { debt: -10, aff: { chaboshi: 12 } }, next: null },
      { text: '推说下回定', effects: { debt: +6, aff: { chaboshi: -5 } }, next: null },
      { text: '无视走开', effects: { aff: { chaboshi: -8 } }, next: null }

    title: '剑客问路',
    text: '路边一个青衫剑客拦住你：“少侠，前方山路可通？在下有事相问。”',
    choices: [
      { text: '指路', effects: { aff: { jiake: 10 } }, next: null },
      { text: '给灵石', effects: { debt: -5, aff: { jiake: 8 } }, next: null },
      { text: '无视', effects: { aff: { jiake: -6 } }, next: null }
    ]
  },
];

const STARTS = [
  // ... previous ...
  { id: 'shanzei_1', label: '山贼拦路' },
  { id: 'huolang_1', label: '货郎讨账' },
  { id: 'chaboshi_1', label: '茶博士讨茶资' },
  { id: 'jiake_1', label: '剑客问路' }
];

let state = { debt: 80, aff: { merchant: 0, wanderer: 0, farmer: 0, blackmarket: 0, collector: 0, wounded: 0, beggar: 0, jiantong: 0, yaotong: 0, chaguan: 0, tiejiang: 0, yufu: 0, shusheng: 0, kezhan: 0, daoshi: 0, shanzei: 0, huolang: 0, chaboshi: 0, jiake: 0 }, current: 'debt_merchant_1' };

function startChain(id) {
  state = { debt: 80, aff: { merchant: 0, wanderer: 0, farmer: 0, blackmarket: 0, collector: 0, wounded: 0, beggar: 0, jiantong: 0, yaotong: 0, chaguan: 0, tiejiang: 0, yufu: 0, shusheng: 0, kezhan: 0, daoshi: 0, shanzei: 0, huolang: 0, chaboshi: 0, jiake: 0 }, current: id };
  renderSwitch();
  render();
}

// ... rest of the functions, with end buttons including the new one ...
function render() {
  // same as before, add button for huolang
  if (!chain) {
    app.innerHTML = `<div class="card"><h2>链条结束</h2><p>最终债务：${state.debt}，好感：${Object.entries(state.aff).map(([k,v])=>k+':'+v).join('　')}</p><button class="choice" onclick="startChain('debt_merchant_1')">重新开始（贩子）</button><!-- previous buttons --><button class="choice" onclick="startChain('huolang_1')">重新开始（货郎）</button></div>`;
    return;
  }
  // ...
}
renderSwitch();
render();
</script>
</body>
</html>
